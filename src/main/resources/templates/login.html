<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в библиотеку</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="page">

    <div class="card">

        <h1>📚 Вход в библиотеку</h1>

        <form method="post" action="/login">

            <div class="form-group">
                <label for="username">Логин</label>

                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Введите логин"
                       required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Введите пароль"
                       required>
            </div>

            <button type="submit" class="button button-full">
                Войти
            </button>

        </form>

        <p style="text-align: center; margin-top: 20px;">
            Нет аккаунта?
            <a href="/register" class="link">Зарегистрироваться</a>
        </p>

        <div class="error" th:if="${param.error}">
            Неверный логин или пароль.
        </div>

        <div class="message" th:if="${param.logout}">
            Вы вышли из системы.
        </div>

        <div class="message" th:if="${param.registered}">
            Регистрация прошла успешно. Теперь можно войти в систему.
        </div>

    </div>

</div>

</body>
</html>
