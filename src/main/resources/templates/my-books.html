<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>Мои книги — Библиотека</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

<header class="header">

  <div class="logo">
    📚 БИБЛИОТЕКА
  </div>

  <div>
    <a href="/reader">Личный кабинет</a>
    <a href="/books">Книги</a>
    <a href="/logout">Выйти</a>
  </div>

</header>


<div class="page books-page">

  <div class="books-header">

    <h1>Мои книги</h1>

    <p class="subtitle">
      Книги, которые были выданы вам в библиотеке
    </p>

  </div>


  <div class="table-card">

    <table class="books-table">

      <thead>
      <tr>
        <th>Книга</th>
        <th>Инвентарный номер</th>
        <th>Дата выдачи</th>
        <th>Вернуть до</th>
        <th>Дата возврата</th>
        <th>Статус</th>
      </tr>
      </thead>

      <tbody>

      <tr th:each="loan : ${loans}">

        <td class="book-title"
            th:text="${loan.copy.book.title}">
          Название книги
        </td>

        <td th:text="${loan.copy.inventoryNumber}">
          BK-001-1
        </td>

        <td th:text="${loan.issueDate}">
          2026-09-15
        </td>

        <td th:text="${loan.dueDate}">
          2026-09-25
        </td>

        <td th:text="${loan.returnDate != null ? loan.returnDate : '—'}">
          —
        </td>

        <td th:text="${loan.status}">
          ACTIVE
        </td>

      </tr>

      <tr th:if="${#lists.isEmpty(loans)}">

        <td colspan="6" style="text-align: center;">
          У вас пока нет выданных книг.
        </td>

      </tr>

      </tbody>

    </table>

  </div>


  <div style="margin-top: 20px;">

    <a href="/reader" class="button">
      ← Вернуться в личный кабинет
    </a>

  </div>

</div>

</body>
</html>
