<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <title
          th:text="${'Редактирование — ' + book.title}">
    Редактирование книги — Библиотека
  </title>

  <link rel="stylesheet" href="/style.css">

</head>


<body>


<header class="header">

  <div class="logo">
    📚 БИБЛИОТЕКА
  </div>

  <div>

    <a href="/librarian">
      Личный кабинет
    </a>

    <a href="/books">
      Книги
    </a>

    <a href="/logout">
      Выйти
    </a>

  </div>

</header>


<div class="page">


  <div class="books-header">

    <h1>
      Редактирование книги
    </h1>

    <p
            class="subtitle"
            th:text="${book.title}">
      Название книги
    </p>

  </div>


  <!-- Сообщение об ошибке -->

  <div
          class="error-message"
          th:if="${errorMessage}"
          th:text="${errorMessage}">

  </div>


  <div class="card">


    <form
            method="post"
            th:action="@{/librarian/books/{id}/edit(id=${book.id})}">


      <!-- Название -->

      <div class="form-group">

        <label for="title">
          Название книги *
        </label>

        <input
                type="text"
                id="title"
                name="title"
                required
                maxlength="255"
                th:value="${book.title}">

      </div>


      <!-- Автор -->

      <div class="form-group">

        <label for="authorId">
          Автор *
        </label>

        <select
                id="authorId"
                name="authorId"
                required>

          <option
                  th:each="author : ${authors}"
                  th:value="${author.id}"
                  th:text="${author.lastName + ' ' + author.firstName}"
                  th:selected="${book.authors[0].id == author.id}">

          </option>

        </select>

      </div>


      <!-- Жанр -->

      <div class="form-group">

        <label for="genreId">
          Жанр *
        </label>

        <select
                id="genreId"
                name="genreId"
                required>

          <option
                  th:each="genre : ${genres}"
                  th:value="${genre.id}"
                  th:text="${genre.name}"
                  th:selected="${book.genre.id == genre.id}">

          </option>

        </select>

      </div>


      <!-- ISBN -->

      <div class="form-group">

        <label for="isbn">
          ISBN
        </label>

        <input
                type="text"
                id="isbn"
                name="isbn"
                maxlength="20"
                th:value="${book.isbn}"
                placeholder="Например, 9780000000031">

      </div>


      <!-- Год -->

      <div class="form-group">

        <label for="publicationYear">
          Год издания
        </label>

        <input
                type="number"
                id="publicationYear"
                name="publicationYear"
                min="1"
                max="2100"
                th:value="${book.publicationYear}"
                placeholder="Например, 2026">

      </div>


      <!-- Аннотация -->

      <div class="form-group">

        <label for="description">
          Аннотация / сюжет
        </label>

        <textarea
                id="description"
                name="description"
                rows="10"
                placeholder="Введите аннотацию или краткий сюжет книги"
                th:text="${book.description}">
                </textarea>

      </div>


      <!-- Информация об экземплярах -->

      <div class="form-group">

        <label>
          Экземпляры книги
        </label>

        <small>
          Количество экземпляров изменяется отдельно.
        </small>

      </div>


      <!-- Кнопки -->

      <div style="margin-top: 25px;">

        <button
                type="submit"
                class="button">

          💾 Сохранить изменения

        </button>


        <a
                th:href="@{/books/{id}(id=${book.id})}"
                class="button button-small"
                style="margin-left: 10px;">

          Отмена

        </a>

      </div>


    </form>


  </div>


</div>


</body>

</html>
