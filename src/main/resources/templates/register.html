<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация — Библиотека</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="page">

    <div class="card">

        <h1>📚 Регистрация</h1>

        <form method="post" action="/register">

            <div class="form-group">
                <label for="firstName">Имя</label>

                <input type="text"
                       id="firstName"
                       name="firstName"
                       placeholder="Введите имя"
                       required>
            </div>

            <div class="form-group">
                <label for="lastName">Фамилия</label>

                <input type="text"
                       id="lastName"
                       name="lastName"
                       placeholder="Введите фамилию"
                       required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Введите email"
                       required>
            </div>

            <div class="form-group">
                <label for="login">Логин</label>

                <input type="text"
                       id="login"
                       name="login"
                       placeholder="Придумайте логин"
                       required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Придумайте пароль"
                       required>
            </div>

            <button type="submit" class="button button-full">
                Зарегистрироваться
            </button>

        </form>

        <p style="text-align: center; margin-top: 20px;">
            Уже есть аккаунт?
            <a href="/login" class="link">Войти</a>
        </p>

        <div class="error"
             th:if="${error}"
             th:text="${error}">
        </div>

    </div>

</div>

</body>
</html>
