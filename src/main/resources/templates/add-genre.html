<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <title>
    Добавление жанра — Библиотека
  </title>

  <link rel="stylesheet"
        href="/style.css">

</head>


<body>


<header class="header">

  <div class="logo">
    📚 БИБЛИОТЕКА
  </div>

  <div>

    <a href="/librarian">
      Личный кабинет
    </a>

    <a href="/books">
      Книги
    </a>

    <a href="/logout">
      Выйти
    </a>

  </div>

</header>


<div class="page">


  <div class="books-header">

    <h1>
      Добавление жанра
    </h1>

    <p class="subtitle">
      Добавление нового жанра книги
    </p>

  </div>


  <!-- Сообщение об ошибке -->

  <div
          class="error-message"
          th:if="${errorMessage}"
          th:text="${errorMessage}">

  </div>


  <div class="card">


    <form
            method="post"
            action="/librarian/genres/add">


      <div class="form-group">

        <label for="name">
          Название жанра *
        </label>

        <input
                type="text"
                id="name"
                name="name"
                required
                maxlength="100"
                placeholder="Например, Фантастика">

      </div>


      <div style="margin-top: 25px;">

        <button
                type="submit"
                class="button">

          ➕ Добавить жанр

        </button>


        <a
                href="/librarian/books/add"
                class="button button-small"
                style="margin-left: 10px;">

          Отмена

        </a>

      </div>


    </form>


  </div>


</div>


</body>

</html>
